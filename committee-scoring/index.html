<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>CHMD · Valoración Final</title>
<style>
  :root{
    --navy:#1B3858;
    --navy-2:#264a70;
    --gold:#C9A84C;
    --gold-soft:#F6EFD9;
    --dan:#1A5276;
    --dan-soft:#E3EDF5;
    --lila:#1E8449;
    --lila-soft:#E2F2E8;
    --bg:#F4F6F9;
    --card:#FFFFFF;
    --text:#1F2937;
    --muted:#6B7280;
    --border:#E2E6EC;
    --danger:#B42318;
    --radius:14px;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.45;font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea{font:inherit;color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}

  /* Encabezado */
  header.brand{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
  header.brand .wrap{padding-top:18px;padding-bottom:16px;display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;flex:none;color:var(--gold);font-weight:700;font-size:20px}
  .brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:13px;color:#cfd8e3}
  .demo-banner{background:#FFF4E5;color:#8A4B00;font-size:13px;text-align:center;padding:8px 16px;border-bottom:1px solid #F5D7A8}

  /* Progreso */
  .progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .progress .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
  .progress .row b{color:var(--navy)}
  .progress .row > span{white-space:nowrap}
  .progress .pend{font-size:12px;font-weight:700;color:#8A4B00;margin:-2px 0 6px}
  .bar{height:6px;background:#dfe4eb;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}

  /* Tarjetas */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:14px 0}
  .card h2{margin:0 0 6px;font-size:20px;color:var(--navy)}
  .card h3{margin:0;font-size:16px;color:var(--navy)}
  .lead{color:var(--muted);margin:0 0 4px;font-size:15px}
  .section-title{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:24px 0 4px}

  label.fld{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  input[type=text],input[type=password],textarea{
    width:100%;border:1px solid #cdd4de;border-radius:10px;padding:12px 14px;background:#fff;font-size:16px;
  }
  textarea{resize:vertical;min-height:64px}
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}

  .btn{appearance:none;border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{background:var(--navy-2)}
  .btn.gold{background:var(--gold);color:var(--navy)}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid #cdd4de}
  .btn.small{padding:8px 12px;font-size:14px}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid #f1c3bf}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .nav{display:flex;gap:10px;margin-top:20px}
  .nav .btn{flex:1}

  /* Tarjeta de criterio */
  .crit{position:relative}
  .crit.missing{border-color:var(--danger);box-shadow:0 0 0 2px rgba(180,35,24,.15)}
  .crit.key{border:2px solid var(--gold);background:linear-gradient(0deg,#fff,#fff) padding-box}
  .crit .head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
  .crit .num{font-weight:700;color:var(--gold);margin-right:4px}
  .weight{flex:none;font-size:12px;font-weight:700;background:#EEF1F5;color:var(--navy);padding:4px 8px;border-radius:999px}
  .crit.key .weight{background:var(--gold);color:var(--navy)}
  .flag{display:inline-block;margin:8px 0 0;font-size:12px;font-weight:700;color:#7a5c12;background:var(--gold-soft);border:1px solid #ead9a6;border-radius:6px;padding:3px 8px}
  .desc{color:var(--muted);font-size:14px;margin:8px 0 12px}
  .cand-row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:10px;margin:8px 0}
  .cand-name{font-weight:700;font-size:14px}
  .cand-name.dan{color:var(--dan)} .cand-name.lila{color:var(--lila)}
  .scale{display:grid;grid-template-columns:repeat(5,1fr) 1.15fr;gap:5px}
  .scale button.no{font-size:13px;color:var(--muted);background:#F6F7F9;border-style:dashed}
  .scale button.no.on{background:#6B7280;border-color:#6B7280;border-style:solid;color:#fff}
  .scale button{border:1px solid #cdd4de;background:#fff;border-radius:9px;height:44px;font-weight:700;cursor:pointer;font-size:16px}
  .scale.dan button.on{background:var(--dan);border-color:var(--dan);color:#fff}
  .scale.lila button.on{background:var(--lila);border-color:var(--lila);color:#fff}
  .legend{display:grid;grid-template-columns:repeat(5,1fr) 1.15fr;gap:5px;hyphens:manual;text-align:center;font-size:11px;line-height:1.2;color:var(--muted);margin:2px 0 0 72px}
  .note{margin-top:10px}
  .guide{margin:8px 0 4px;font-size:14px;color:var(--text)}
  details.more{margin:0 0 10px}
  details.more summary{cursor:pointer;font-size:13px;color:var(--navy);font-weight:600}
  details.more .desc{margin:6px 0}
  .group{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
  .rules{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);display:grid;gap:6px}
  .rules b{color:var(--navy)}
  label.need{display:block;font-size:13px;font-weight:700;color:#8A4B00;margin-bottom:6px}
  .addnote{background:none;border:0;padding:4px 0;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer}
  .note textarea{min-height:44px;font-size:15px;padding:10px 12px}

  /* Botones de elección */
  .q{font-weight:600;margin:0 0 10px}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice button{border:2px solid #cdd4de;background:#fff;border-radius:12px;padding:14px 8px;font-weight:700;cursor:pointer;font-size:16px}
  .choice button.dan{color:var(--dan)} .choice button.lila{color:var(--lila)}
  .choice button.dan.on{background:var(--dan);border-color:var(--dan);color:#fff}
  .choice button.lila.on{background:var(--lila);border-color:var(--lila);color:#fff}
  .choice.big button{padding:22px 8px;font-size:20px}

  .lines input{margin-bottom:8px}
  .err{color:var(--danger);font-size:14px;margin-top:10px;min-height:1em}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .thanks{padding:36px 22px}
  .thanks .check{width:64px;height:64px;border-radius:50%;background:var(--gold-soft);border:2px solid var(--gold);display:grid;place-items:center;margin:0 auto 14px;font-size:30px;color:var(--navy)}

  footer{text-align:center;font-size:12px;color:var(--muted);padding:24px 16px 36px}
  footer a{color:var(--muted)}

  /* Tablero de resultados */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .kpi{border-radius:var(--radius);padding:16px;color:#fff}
  .kpi.dan{background:var(--dan)} .kpi.lila{background:var(--lila)}
  .kpi .lbl{font-size:13px;opacity:.9}
  .kpi .val{font-size:34px;font-weight:800;line-height:1.1;margin-top:4px}
  .kpi .val small{font-size:15px;font-weight:600;opacity:.85}
  .kpi .sub{font-size:13px;opacity:.9;margin-top:4px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted);margin-top:12px}
  .meta b{color:var(--navy)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

  .crow{padding:12px 0;border-top:1px solid var(--border)}
  .crow:first-of-type{border-top:0}
  .crow .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .crow .t{font-weight:600;font-size:14px}
  .crow.key .t::after{content:" ★";color:var(--gold)}
  .hbar{display:grid;grid-template-columns:62px 1fr 40px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
  .hbar .track{height:10px;background:#EEF1F5;border-radius:6px;overflow:hidden}
  .hbar .fill{height:100%;border-radius:6px}
  .hbar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .nocount{font-size:12px;color:var(--muted);margin-top:4px}
  .chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chip.dan{background:var(--dan-soft);color:var(--dan)}
  .chip.lila{background:var(--lila-soft);color:var(--lila)}
  .chip.tie{background:#EEF1F5;color:var(--muted)}
  .chip.warn{background:#FFF4E5;color:#8A4B00}

  .split{display:flex;height:30px;border-radius:8px;overflow:hidden;background:#EEF1F5;font-size:13px;font-weight:700;color:#fff}
  .split div{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap}
  .split .d{background:var(--dan)} .split .l{background:var(--lila)}
  .qrow{padding:12px 0;border-top:1px solid var(--border)}
  .qrow:first-of-type{border-top:0}
  .qrow p{margin:0 0 8px;font-size:14px;font-weight:600}
  .qrow .cnt{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}
  .qrow .cnt .d{color:var(--dan);font-weight:700} .qrow .cnt .l{color:var(--lila);font-weight:700}

  details.ev{border:1px solid var(--border);border-radius:12px;margin:10px 0;background:#fff;overflow:hidden}
  details.ev summary{list-style:none;cursor:pointer;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  details.ev summary::-webkit-details-marker{display:none}
  details.ev summary .nm{font-weight:700;color:var(--navy)}
  details.ev summary .sm{font-size:13px;color:var(--muted)}
  details.ev[open] summary{border-bottom:1px solid var(--border);background:#FAFBFC}
  .ev-body{padding:14px}
  table.sc{width:100%;border-collapse:collapse;font-size:14px}
  table.sc th,table.sc td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  table.sc th{font-size:12px;color:var(--muted);font-weight:600}
  table.sc td.n{text-align:center;font-weight:700;width:44px}
  table.sc td.n.dan{color:var(--dan)} table.sc td.n.lila{color:var(--lila)}
  table.sc .obs{display:block;font-size:13px;color:var(--muted);font-style:italic;margin-top:3px}
  .kv{font-size:14px;margin:6px 0}
  .kv b{color:var(--navy)}
  ol.reason{margin:6px 0 0;padding-left:20px;font-size:14px}

  @media (min-width:640px){
    .cand-row{grid-template-columns:90px 1fr}
    .legend{margin-left:100px}
    .card{padding:22px}
  }
</style>
</head>
<body>

<header class="brand">
  <div class="wrap">
    <div class="logo" aria-hidden="true">✡</div>
    <div>
      <h1>Colegio Hebreo Maguen David</h1>
      <p>Comité de Selección · Dirección General</p>
    </div>
  </div>
</header>
<div id="demoBanner" class="demo-banner" hidden>
  Modo demo — las respuestas se guardan solo en este navegador. Conecta Supabase para operar en vivo (ver README).
</div>

<main class="wrap" id="app" aria-live="polite"></main>

<footer>
  Documento confidencial — Uso exclusivo del Comité de Selección<br />
  <a href="#resultados" id="adminLink">Administración</a>
</footer>

<script>
/* =====================================================================
   CONFIGURACIÓN — lo único que necesitas editar
   ===================================================================== */
const CONFIG = {
  // Datos de Supabase > Project Settings > API. Si se dejan así, la app funciona en modo demo.
  SUPABASE_URL: "YOUR_SUPABASE_URL",           // p. ej. https://abcd1234.supabase.co
  SUPABASE_ANON_KEY: "YOUR_SUPABASE_ANON_KEY", // la llave pública ("anon" / "publishable")

  // Se usa SOLO en modo demo. En vivo, la contraseña la valida Supabase
  // (ver supabase-setup.sql) y nunca aparece en esta página.
  // No pongas aquí la contraseña real: esta página es pública.
  DEMO_ADMIN_PASSWORD: "demo",
};

const SCALE = ["Muy débil", "Débil", "Cumple", "Sólido", "Excepcional"];

const CANDIDATES = [
  { key: "daniela", name: "Daniela", cls: "dan" },
  { key: "lila",    name: "Lila",    cls: "lila" },
];

// Texto tomado del "Instrumento de Valoración Final" (septiembre 2026).
// `guide` = guía breve visible; `desc` = guía completa (desplegable).
// Pesos: deben sumar 100. 10a y 10b se evalúan por separado y comparten el 2% (1% c/u).
const CRITERIA = [
  { id: "c1",  num: "1",  title: "Liderazgo estratégico y visión", weight: 15,
    guide: "Visión de largo plazo que integre lo académico, lo judío y lo comunitario, y la traduzca en dirección concreta.",
    desc: ["¿Puede articular una visión de largo plazo para el CHMD y convertirla en dirección concreta? ¿Su visión integra lo académico, lo judío y lo comunitario, o los trata como mundos separados?"] },
  { id: "c2",  num: "2",  title: "Capacidad de transformación", weight: 15,
    guide: "Mejora significativa sin desestabilizar: construir desde lo que el CHMD ya es, no importar un modelo externo.",
    desc: ["¿Puede desafiar la práctica actual, superar la resistencia y liderar mejora significativa sin desestabilizar el colegio? ¿Entiende que transformar el CHMD es construir desde lo que ya es, no importar un modelo externo?"] },
  { id: "c3",  num: "3",  title: "Liderazgo educativo y académico", weight: 12,
    guide: "Trayectoria real de mejora en aprendizaje y resultados, dominio del Bachillerato Internacional y criterio pedagógico propio.",
    desc: ["¿Tiene trayectoria real de mejora en enseñanza, aprendizaje, evaluación y resultados? ¿Conoce el programa del Bachillerato Internacional (IB) desde adentro? ¿Su criterio pedagógico es propio o depende de lo que le dicen los coordinadores?"] },
  { id: "c4",  num: "4",  title: "Identidad judía y alineación cultural", weight: 18, key: true,
    guide: "No si es judía, sino si defenderá la identidad judía como eje no negociable cuando se le presione.",
    desc: ["No evalúa si la candidata es judía. Evalúa si puede defender la identidad judía como el eje no negociable del colegio cuando una familia la cuestiona, cuando un docente la resiste, o cuando el calendario académico la presiona.",
           "¿Comprende que el judaísmo en el CHMD no es cultura a respetar, sino misión a sostener? ¿Tiene convicción genuina o deferencia protocolar?"] },
  { id: "c5",  num: "5",  title: "Liderazgo comunitario y grupos de interés", weight: 10,
    guide: "Confianza simultánea con Patronato, padres, docentes y comunidad judía. ¿Convoca o impone?",
    desc: ["¿Puede construir confianza simultánea con el Patronato, los padres, el equipo docente y la comunidad judía? ¿Su liderazgo convoca o impone? ¿La seguirían quienes más necesita que la sigan?"] },
  { id: "c6",  num: "6",  title: "Liderazgo de personas y cultura", weight: 8,
    guide: "Inspira, desarrolla y exige a la vez; sabe manejar la resistencia de personal con muchos años en el colegio.",
    desc: ["¿Puede inspirar, desarrollar y responsabilizar a su equipo al mismo tiempo? ¿Genera una cultura de trabajo positiva y de alto desempeño? ¿Cómo maneja a quien resiste el cambio con muchos años en el colegio?"] },
  { id: "c7",  num: "7",  title: "Liderazgo de organización compleja", weight: 8,
    guide: "Evidencia de haber dirigido con éxito una institución de escala y complejidad comparable al CHMD.",
    desc: ["¿Tiene evidencia de haber dirigido exitosamente una institución de escala y complejidad comparable al CHMD, con múltiples grupos de interés y prioridades en tensión permanente?"] },
  { id: "c8",  num: "8",  title: "Cualidades personales y presencia", weight: 7,
    guide: "Juicio, inteligencia emocional, resiliencia e integridad; la misma persona en la junta y en el pasillo.",
    desc: ["¿Tiene juicio, inteligencia emocional, resiliencia e integridad? ¿Genera credibilidad y confianza de forma natural? ¿Es auténtica — lo mismo en la sala de reuniones que en el pasillo del colegio?"] },
  { id: "c9",  num: "9",  title: "Gobernanza y relación con el Patronato", weight: 5,
    guide: "Comunica temas difíciles, rinde cuentas y distingue por instinto su autoridad de la del Patronato.",
    desc: ["¿Puede trabajar efectivamente con el Patronato, comunicar temas difíciles con claridad y establecer una rendición de cuentas apropiada? ¿Entiende dónde termina su autoridad y dónde empieza la del Patronato — de forma instintiva, no solo de forma teórica?"] },
  { id: "c10a", num: "10a", title: "Liderazgo financiero", weight: 1, group: "Finanzas y operación · 2% combinado",
    guide: "Gestión de presupuestos y recursos; sostenibilidad financiera al servicio de la misión educativa.",
    desc: ["¿Tiene capacidad de gestión de presupuestos y recursos? ¿Entiende la relación entre sostenibilidad financiera y misión educativa?",
           "Se evalúa por separado de la operación; ambos comparten el 2% del criterio original. Tiene menor peso porque ambas candidatas tienen esta base cubierta."] },
  { id: "c10b", num: "10b", title: "Liderazgo operativo", weight: 1, group: "Finanzas y operación · 2% combinado",
    guide: "Gestión disciplinada de instalaciones, procesos y operación diaria del colegio.",
    desc: ["¿Gestiona con disciplina las instalaciones, los procesos y la operación diaria del colegio? ¿Anticipa problemas y asegura que la operación sirva al proyecto educativo?",
           "Se evalúa por separado de las finanzas; ambos comparten el 2% del criterio original."] },
];

// Evidencia escrita obligatoria solo si hay puntaje extremo o diferencia importante.
const EVIDENCE_RULE = { extremes: [1, 5], minGap: 2 };
const NO = "NO"; // N/O – no observado / información insuficiente

const QUESTIONS = [
  { id: "q1", text: "¿Quién está más capacitada para liderar la transformación estratégica que el CHMD necesita en los próximos 5–7 años?" },
  { id: "q2", text: "¿Quién tiene más posibilidades de fortalecer el desempeño académico del colegio?" },
  { id: "q3", text: "¿Quién generará mayor confianza entre el Patronato, el equipo, los padres y la comunidad judía?" },
  { id: "q4", text: "¿Quién tiene mayor evidencia de poder liderar con éxito la escala y complejidad particular del CHMD?" },
  { id: "q5", text: "Si designáramos a esta persona mañana, ¿en quién tendrías más confianza de que tendrá éxito en el rol?" },
];

/* =====================================================================
   Almacenamiento (Supabase en vivo, o memoria del navegador en modo demo)
   ===================================================================== */
const DEMO = !/^https:\/\//.test(CONFIG.SUPABASE_URL) || CONFIG.SUPABASE_ANON_KEY.startsWith("YOUR_");
const LS_SUBMITTED = "chmd_eval_submitted_v1";
const LS_DRAFT = "chmd_eval_draft_v2";
const LS_DEMO_DB = "chmd_eval_demo_db_v1";

const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};

function sbHeaders(extra){
  return Object.assign({
    "apikey": CONFIG.SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY,
    "Content-Type": "application/json",
  }, extra || {});
}
const sbBase = () => CONFIG.SUPABASE_URL.replace(/\/+$/, "");

const api = {
  async submit(row){
    if (DEMO){
      const db = ls.get(LS_DEMO_DB) || [];
      const k = row.evaluator_name.trim().toLowerCase();
      if (db.some(r => r.evaluator_name.trim().toLowerCase() === k)) throw new Error("DUPLICATE");
      db.push(Object.assign({ id: String(Date.now()) + Math.random().toString(16).slice(2), created_at: new Date().toISOString() }, row));
      ls.set(LS_DEMO_DB, db);
      return;
    }
    const res = await fetch(sbBase() + "/rest/v1/evaluations", {
      method: "POST", headers: sbHeaders({ "Prefer": "return=minimal" }), body: JSON.stringify(row),
    });
    if (res.status === 409) throw new Error("DUPLICATE");
    if (!res.ok) throw new Error("error del servidor, código " + res.status);
  },
  async results(password){
    if (DEMO){
      if (password !== CONFIG.DEMO_ADMIN_PASSWORD) throw new Error("BAD_PASSWORD");
      return ls.get(LS_DEMO_DB) || [];
    }
    const res = await fetch(sbBase() + "/rest/v1/rpc/get_results", {
      method: "POST", headers: sbHeaders(), body: JSON.stringify({ p_password: password }),
    });
    if (!res.ok){
      const t = await res.text();
      if (/contraseña inválida|invalid admin password/i.test(t)) throw new Error("BAD_PASSWORD");
      throw new Error("No se pudieron cargar los resultados (error del servidor, código " + res.status + ").");
    }
    return res.json();
  },
  async remove(password, id){
    if (DEMO){
      ls.set(LS_DEMO_DB, (ls.get(LS_DEMO_DB) || []).filter(r => r.id !== id));
      return;
    }
    const res = await fetch(sbBase() + "/rest/v1/rpc/delete_evaluation", {
      method: "POST", headers: sbHeaders(), body: JSON.stringify({ p_password: password, p_id: id }),
    });
    if (!res.ok) throw new Error("No se pudo eliminar (" + res.status + ")");
  },
};

/* =====================================================================
   Utilidades
   ===================================================================== */
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
// Mensajes de error siempre en español (el navegador los da en inglés, p. ej. "Failed to fetch").
const errText = e => e instanceof TypeError ? "Sin conexión con el servidor. Revisa tu internet e intenta de nuevo." : e.message;
const fmt = (n, d = 2) => (n == null || isNaN(n)) ? "–" : n.toFixed(d);
const candByName = n => CANDIDATES.find(c => c.name === n);
const isNum = v => typeof v === "number" && v >= 1 && v <= 5;
const showVal = v => v === NO ? "N/O" : (v ?? "–");
// Ponderado individual: excluye N/O y reescala sobre el peso efectivamente evaluado.
function weighted(scores, candKey){
  let t = 0, w = 0;
  for (const c of CRITERIA){ const v = scores && scores[c.id] && scores[c.id][candKey]; if (isNum(v)){ t += v * c.weight; w += c.weight; } }
  return w ? t / w : null;
}
function evidenceReason(s){
  const vals = [s.daniela, s.lila];
  if (vals.some(v => EVIDENCE_RULE.extremes.includes(v))) return "puntaje extremo (1 o 5)";
  if (isNum(s.daniela) && isNum(s.lila) && Math.abs(s.daniela - s.lila) >= EVIDENCE_RULE.minGap) return `diferencia de ${Math.abs(s.daniela - s.lila)} puntos entre candidatas`;
  return null;
}

/* =====================================================================
   Flujo del evaluador
   ===================================================================== */
function blankDraft(){
  const scores = {};
  CRITERIA.forEach(c => scores[c.id] = { daniela: null, lila: null, note: "" });
  const comparisons = {};
  QUESTIONS.forEach(q => comparisons[q.id] = null);
  return { step: 0, name: "", scores, comparisons, final_choice: null, final_reasoning: ["", "", ""] };
}
let draft = (() => {
  const d = blankDraft(), saved = ls.get(LS_DRAFT) || {};
  Object.assign(d, saved, { scores: d.scores, comparisons: Object.assign(d.comparisons, saved.comparisons || {}) });
  CRITERIA.forEach(c => Object.assign(d.scores[c.id], (saved.scores || {})[c.id] || {}));
  return d;
})();
const saveDraft = () => ls.set(LS_DRAFT, draft);

const STEPS = ["Inicio", "Parte 1 · Puntajes", "Parte 2 · Contraste", "Parte 3 · Preferencia final"];

function progressHTML(){
  let done = 0, total = 0, label = "", extra = "";
  if (draft.step === 1){
    total = CRITERIA.length * 2;
    CRITERIA.forEach(c => { if (draft.scores[c.id].daniela) done++; if (draft.scores[c.id].lila) done++; });
    const needNote = CRITERIA.filter(c => evidenceReason(draft.scores[c.id]) && !draft.scores[c.id].note.trim()).length;
    label = done + " / " + total + " puntajes";
    if (needNote) extra = `${needNote} evidencia${needNote > 1 ? "s" : ""} escrita${needNote > 1 ? "s" : ""} pendiente${needNote > 1 ? "s" : ""}`;
  } else if (draft.step === 2){
    total = QUESTIONS.length; done = QUESTIONS.filter(q => draft.comparisons[q.id]).length;
    label = done + " / " + total + " respondidas";
  } else if (draft.step === 3){
    total = 2; done = (draft.final_choice ? 1 : 0) + (draft.final_reasoning.some(x => x.trim()) ? 1 : 0);
    label = draft.final_choice ? "Elegida" : "Elige una";
  }
  const pct = ((draft.step - 1) / 3 + (total ? done / total / 3 : 0)) * 100;
  return `<div class="progress" id="progress">
    <div class="row"><span><b>${esc(STEPS[draft.step])}</b> <span class="muted">(${draft.step}/3)</span></span><span>${label}</span></div>
    ${extra ? `<div class="pend">${extra}</div>` : ""}
    <div class="bar"><i style="width:${Math.max(3, pct)}%"></i></div>
  </div>`;
}
function refreshProgress(){
  const el = document.getElementById("progress");
  if (el) el.outerHTML = progressHTML();
}

function renderEvaluator(){
  const submitted = ls.get(LS_SUBMITTED);
  if (submitted) return renderThanks(submitted.name, true);
  if (draft.step === 0) return renderWelcome();
  if (draft.step === 1) return renderPart1();
  if (draft.step === 2) return renderPart2();
  if (draft.step === 3) return renderPart3();
}

function noteHTML(cid){
  const s = draft.scores[cid], reason = evidenceReason(s);
  if (reason) return `<label class="need" for="note-${cid}">Evidencia requerida · ${esc(reason)}</label>
    <textarea id="note-${cid}" data-note="${cid}" maxlength="500" placeholder="¿Qué observaste concretamente que justifica este puntaje?">${esc(s.note)}</textarea>`;
  if (s.note || s.open) return `<textarea id="note-${cid}" data-note="${cid}" maxlength="500" placeholder="Evidencia observada (opcional)">${esc(s.note)}</textarea>`;
  return `<button type="button" class="addnote" data-open="${cid}">+ Agregar evidencia (opcional)</button>`;
}
function bindNote(cid){
  const box = document.getElementById("note-box-" + cid);

  if (t) t.oninput = () => { draft.scores[cid].note = t.value; saveDraft(); if (t.value.trim()) box.closest(".crit").classList.remove("missing"); refreshProgress(); };
  if (o) o.onclick = () => { draft.scores[cid].open = true; box.innerHTML = noteHTML(cid); bindNote(cid); box.querySelector("textarea").focus(); };
}
const cardIncomplete = c => { const s = draft.scores[c.id]; return !s.daniela || !s.lila || (evidenceReason(s) && !s.note.trim()); };

async function submit(){
  const err = document.getElementById("err");
  const btn = document.getElementById("submit");
  if (!draft.final_choice){ err.textContent = "Elige tu preferencia final."; document.getElementById("card-final").classList.add("missing"); return; }
  if (!draft.final_reasoning.some(x => x.trim())){ err.textContent = "Escribe al menos una línea con tu razón principal."; return; }
  if (!confirm("¿Enviar tu valoración? Después no podrás modificarla.")) return;

  btn.disabled = true; btn.textContent = "Enviando…"; err.textContent = "";
  const row = {
    evaluator_name: draft.name.trim(),
    scores: Object.fromEntries(CRITERIA.map(c => { const x = draft.scores[c.id]; return [c.id, { daniela: x.daniela, lila: x.lila, note: x.note.trim() }]; })),
    comparisons: draft.comparisons,
    final_choice: draft.final_choice,
    final_reasoning: draft.final_reasoning.map(s => s.trim()).filter(Boolean),
  };
  try {
    await api.submit(row);
    ls.set(LS_SUBMITTED, { name: row.evaluator_name, at: new Date().toISOString() });
    ls.del(LS_DRAFT);
    renderThanks(row.evaluator_name, false);
  } catch (e){
    btn.disabled = false; btn.textContent = "Enviar valoración";
    err.textContent = e.message === "DUPLICATE"
      ? "Ya existe una valoración con este nombre. Si es un error, contacta a quien coordina el Comité."
      : "No se pudo enviar. " + (e instanceof TypeError ? "Revisa tu conexión e intenta de nuevo." : "Intenta de nuevo (" + e.message + ").");
  }
}

function aggregate(rows){
  const n = rows.length;
  const crit = CRITERIA.map(c => {
    const avg = {}, no = {};
    CANDIDATES.forEach(cd => {
      const raw = rows.map(r => r.scores && r.scores[c.id] && r.scores[c.id][cd.key]);
      const vals = raw.filter(isNum);
      avg[cd.key] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      no[cd.key] = raw.filter(v => v === NO).length;
    });
    const diff = avg.daniela != null && avg.lila != null ? avg.daniela - avg.lila : null;
    return { c, avg, no, diff };
  });
  // Total del Comité = promedio de los ponderados individuales (cada uno ya ajustado por N/O).
  const total = {};
  CANDIDATES.forEach(cd => {
    const ws = rows.map(r => weighted(r.scores, cd.key)).filter(v => v != null);
    total[cd.key] = ws.length ? ws.reduce((a, b) => a + b, 0) / ws.length : null;
  });
  const noTotal = crit.reduce((t, x) => t + x.no.daniela + x.no.lila, 0);
  const q = QUESTIONS.map(qq => {
    const t = { Daniela: 0, Lila: 0 };
    rows.forEach(r => { const v = r.comparisons && r.comparisons[qq.id]; if (t[v] != null) t[v]++; });
    return { q: qq, t };
  });
  const fin = { Daniela: 0, Lila: 0 };
  rows.forEach(r => { if (fin[r.final_choice] != null) fin[r.final_choice]++; });
  return { n, crit, total, q, fin, noTotal };
}

function advChip(diff){
  if (diff == null) return `<span class="chip tie">Sin base</span>`;
  if (Math.abs(diff) < 0.05) return `<span class="chip tie">Empate</span>`;
  const c = diff > 0 ? CANDIDATES[0] : CANDIDATES[1];
  return `<span class="chip ${c.cls}">${c.name} +${fmt(Math.abs(diff))}</span>`;
}

function splitBar(d, l){
  const t = d + l;
  if (!t) return `<div class="split"><div style="flex:1;color:var(--muted)">Sin respuestas</div></div>`;
  return `<div class="split">

    ${l ? `<div class="l" style="flex:${l}">${Math.round(l / t * 100)}%</div>` : ""}

}

function renderDashboard(){
  const A = aggregate(adminData);
  const lead = A.n && A.total.daniela != null && A.total.lila != null ? (Math.abs(A.total.daniela - A.total.lila) < 0.005 ? null : (A.total.daniela > A.total.lila ? "Daniela" : "Lila")) : null;

  const evCards = adminData.map(r => {
    const wd = weighted(r.scores, "daniela"), wl = weighted(r.scores, "lila");
    const nNO = CRITERIA.filter(c => { const s = (r.scores && r.scores[c.id]) || {}; return s.daniela === NO || s.lila === NO; }).length;
    const scoreLeader = wd == null || wl == null || Math.abs(wd - wl) < 0.005 ? null : (wd > wl ? "Daniela" : "Lila");
    const mismatch = scoreLeader && r.final_choice && scoreLeader !== r.final_choice;
    const fc = candByName(r.final_choice);
    return `
    <details class="ev">
      <summary>
        <div><div class="nm">${esc(r.evaluator_name)}</div>
          <div class="sm">Ponderado: <b style="color:var(--dan)">${fmt(wd)}</b> frente a <b style="color:var(--lila)">${fmt(wl)}</b>${nNO ? ` · N/O en ${nNO}` : ""} · ${new Date(r.created_at).toLocaleString("es-MX")}</div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          ${fc ? `<span class="chip ${fc.cls}">${fc.name}</span>` : ""}
          ${mismatch ? `<span class="chip warn" title="Su preferencia final difiere de su puntaje ponderado más alto">≠ puntajes</span>` : ""}
        </div>
      </summary>
      <div class="ev-body">
        <table class="sc">
          <thead><tr><th>Criterio</th><th style="text-align:center">Daniela</th><th style="text-align:center">Lila</th></tr></thead>
          <tbody>
          ${CRITERIA.map(c => { const s = (r.scores && r.scores[c.id]) || {}; return `
            <tr><td>${c.num}. ${esc(c.title)} <span class="muted">(${c.weight}%)</span>${s.note ? `<span class="obs">“${esc(s.note)}”</span>` : ""}</td>
            <td class="n dan">${esc(showVal(s.daniela))}</td><td class="n lila">${esc(showVal(s.lila))}</td></tr>`; }).join("")}
          </tbody>
        </table>
        <div class="section-title" style="margin-top:16px">Preguntas de contraste</div>
        ${QUESTIONS.map((q, i) => { const v = r.comparisons && r.comparisons[q.id]; const c = candByName(v);
          return `<div class="kv">${i + 1}. ${esc(q.text)} → ${c ? `<b style="color:var(--${c.cls})">${c.name}</b>` : "–"}</div>`; }).join("")}
        <div class="section-title" style="margin-top:16px">Preferencia final</div>
        <div class="kv">${fc ? `<b style="color:var(--${fc.cls})">${fc.name}</b>` : "–"}</div>
        ${(r.final_reasoning || []).length ? `<ol class="reason">${r.final_reasoning.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
        <div style="margin-top:16px;text-align:right"><button class="btn small danger" data-del="${esc(r.id)}" data-nm="${esc(r.evaluator_name)}">Eliminar esta respuesta</button></div>
      </div>
    </details>`; }).join("");

  $app.innerHTML = `
    <div class="section-title">Resultados del Comité</div>
    <div class="toolbar">
      <button class="btn small" id="refresh">↻ Actualizar</button>
      <button class="btn small ghost" id="csv" ${A.n ? "" : "disabled"}>Exportar CSV</button>
      <button class="btn small ghost" id="logout">Salir</button>
    </div>

    <div class="card">
      <h3>Total ponderado (sobre 5)</h3>
      <div class="kpis" style="margin-top:12px">
        ${CANDIDATES.map(c => `<div class="kpi ${c.cls}"><div class="lbl">${c.name}</div>
          <div class="val">${fmt(A.total[c.key])}<small> / 5</small></div>
          <div class="sub">${A.fin[c.name]} preferencia${A.fin[c.name] === 1 ? "" : "s"} final${A.fin[c.name] === 1 ? "" : "es"}</div></div>`).join("")}
      </div>
      <div class="meta">
        <span>Evaluadores: <b>${A.n}</b></span>
        <span>Respuestas N/O: <b>${A.noTotal}</b></span>
        <span>Ventaja en puntaje: <b>${lead ? `<span style="color:var(--${candByName(lead).cls})">${lead}</span> (+${fmt(Math.abs(A.total.daniela - A.total.lila))})` : (A.n ? "Empate" : "–")}</b></span>
      </div>
      <p class="desc" style="margin:10px 0 0">Promedio de los ponderados individuales. Cada ponderado excluye los criterios marcados N/O y se reescala sobre el peso efectivamente evaluado.</p>
    </div>

    ${A.n ? `
    <div class="card">
      <h3>Preferencia final</h3>
      <div style="margin-top:12px">${splitBar(A.fin.Daniela, A.fin.Lila)}</div>
      <div class="qrow" style="border:0;padding-top:0"><div class="cnt"><span class="d">Daniela · ${A.fin.Daniela}</span><span class="l">Lila · ${A.fin.Lila}</span></div></div>
    </div>

    <div class="card">
      <h3>Desglose por criterio</h3>
      <p class="desc" style="margin-bottom:4px">Promedio por candidata (1–5), sin contar N/O. ★ = criterio de mayor peso. 10a y 10b comparten el 2%.</p>
      ${A.crit.map(x => `
        <div class="crow ${x.c.key ? "key" : ""}">
          <div class="top"><span class="t">${x.c.num}. ${esc(x.c.title)} <span class="muted">· ${x.c.weight}%</span></span>${advChip(x.diff)}</div>
          ${CANDIDATES.map(cd => `<div class="hbar"><span class="cand-name ${cd.cls}">${cd.name}</span>
            <div class="track"><div class="fill" style="width:${(x.avg[cd.key] || 0) / 5 * 100}%;background:var(--${cd.cls})"></div></div>
            <span class="v">${fmt(x.avg[cd.key])}</span></div>`).join("")}
          ${x.no.daniela || x.no.lila ? `<div class="nocount">N/O: Daniela ${x.no.daniela} · Lila ${x.no.lila}</div>` : ""}
        </div>`).join("")}
    </div>

    <div class="card">
      <h3>Preguntas de contraste</h3>
      ${A.q.map((x, i) => `
        <div class="qrow"><p>${i + 1}. ${esc(x.q.text)}</p>
          ${splitBar(x.t.Daniela, x.t.Lila)}
          <div class="cnt"><span class="d">Daniela · ${x.t.Daniela}</span><span class="l">Lila · ${x.t.Lila}</span></div>
        </div>`).join("")}
    </div>

    <div class="card">
      <h3>Respuestas individuales</h3>
      <p class="desc">Toca un nombre para ver el detalle. “≠ puntajes” marca a quien eligió una candidata distinta a la que salió mejor en sus propios puntajes.</p>
      ${evCards}
    </div>` : `<div class="card center"><p class="lead">Todavía no hay valoraciones enviadas.</p></div>`}
  `;

  document.getElementById("refresh").onclick = async () => {
    try { adminData = await api.results(adminPassword); renderDashboard(); } catch (e){ alert(errText(e)); }
  };
  document.getElementById("logout").onclick = () => {
    adminPassword = null; adminData = [];
    history.replaceState(null, "", location.pathname + location.search);
    renderEvaluator();
  };
  document.getElementById("csv").onclick = exportCSV;
  $app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(`¿Eliminar la valoración de "${b.dataset.nm}"? No se puede deshacer.`)) return;
    try { await api.remove(adminPassword, b.dataset.del); adminData = await api.results(adminPassword); renderDashboard(); }
    catch (e){ alert(errText(e)); }
  });
}

function exportCSV(){
  const head = ["Evaluador", "Fecha de envío"];
  CRITERIA.forEach(c => head.push(`C${c.num} Daniela`, `C${c.num} Lila`, `C${c.num} Evidencia`));
  head.push("Ponderado Daniela", "Ponderado Lila");
  QUESTIONS.forEach((q, i) => head.push(`Q${i + 1}`));
  head.push("Preferencia final", "Razón 1", "Razón 2", "Razón 3");
  const rows = adminData.map(r => {
    const out = [r.evaluator_name, r.created_at];
    CRITERIA.forEach(c => { const s = (r.scores && r.scores[c.id]) || {}; out.push(s.daniela == null ? "" : showVal(s.daniela), s.lila == null ? "" : showVal(s.lila), s.note || ""); });
    out.push(fmt(weighted(r.scores, "daniela")), fmt(weighted(r.scores, "lila")));
    QUESTIONS.forEach(q => out.push((r.comparisons && r.comparisons[q.id]) || ""));
    const fr = r.final_reasoning || [];
    out.push(r.final_choice || "", fr[0] || "", fr[1] || "", fr[2] || "");
    return out;
  });
  const csv = [head, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "chmd-resultados-comite.csv";
  document.body.appendChild(a); a.click(); a.remove();
}

function route(){
  if (location.hash === "#resultados" || location.hash === "#admin"){ adminPassword ? renderDashboard() : renderAdminLogin(); }
  else renderEvaluator();
}
window.addEventListener("hashchange", route);
if (DEMO) document.getElementById("demoBanner").hidden = false;
route();
</script>
